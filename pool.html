<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="./flavocon.png">
  <link rel="apple-touch-icon" href="./flavocon.png">
  <title>Zeedpay Money Pool</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#dbe9ff 0,#f5f7fb 40%);padding:24px 16px}
    main{width:min(680px,100%);margin:0 auto}.brand{display:flex;align-items:center;gap:9px;color:#174985;font-weight:800;font-size:1.05rem;margin:4px 2px 18px}.brand-mark{display:grid;place-items:center;width:33px;height:33px;border-radius:11px;overflow:hidden;background:#0d5bd7;box-shadow:0 8px 18px #0d5bd733}.brand-mark img{display:block;width:100%;height:100%;object-fit:cover}
    .card{background:#fff;border:1px solid #e5eaf2;border-radius:24px;box-shadow:0 18px 44px #1a376314;overflow:hidden}.hero{padding:26px 25px 22px;background:linear-gradient(135deg,#0d5bd7,#174985);color:#fff}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.66rem;font-weight:800;color:#cfe0ff}.hero h1{font-size:clamp(1.55rem,5vw,2.25rem);line-height:1.12;margin:10px 0 8px}.hero p{color:#e0ebff;line-height:1.55;font-size:.9rem;margin:0;white-space:pre-wrap}.organizer{display:flex;align-items:center;gap:10px;margin-top:19px;color:#e7efff;font-size:.77rem}.avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#ffffff2b;font-weight:800}.body{padding:23px 25px}.progress-label{display:flex;justify-content:space-between;gap:10px;font-size:.76rem;color:#697386;margin-bottom:8px}.progress-label strong{color:#182235}.progress{height:11px;border-radius:20px;background:#edf1f6;overflow:hidden}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#0d5bd7,#65aaff)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0 23px}.stat{padding:13px;border:1px solid #edf0f5;border-radius:15px}.stat small{display:block;color:#8992a2;font-size:.67rem}.stat strong{display:block;margin-top:5px;font-size:1.02rem}.method{display:inline-flex;align-items:center;padding:7px 10px;border-radius:10px;color:#174985;background:#eef4ff;font-size:.72rem;font-weight:750;margin-bottom:18px}.form-title{font-size:1rem;margin:0 0 14px}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:.7rem;font-weight:700;color:#626d7f}.field input{width:100%;height:44px;border:1px solid #dfe5ee;border-radius:12px;padding:0 12px;outline:0;color:#182235;background:#fff;font:inherit;font-size:.86rem}.field input:focus{border-color:#0d5bd7;box-shadow:0 0 0 3px #0d5bd71c}.primary{height:47px;border:0;border-radius:13px;background:#0d5bd7;color:#fff;font:inherit;font-size:.86rem;font-weight:800;cursor:pointer;margin-top:3px}.primary:disabled{opacity:.65;cursor:wait}.fine{font-size:.68rem;color:#8a93a1;line-height:1.45;margin:1px 0 0}.notice{display:none;padding:13px 14px;border-radius:13px;font-size:.78rem;line-height:1.45;margin-bottom:15px}.notice.show{display:block}.notice.pending{color:#725910;background:#fff7dc}.notice.success{color:#18743b;background:#e9f8ee}.notice.error{color:#a42c35;background:#fff0f0}.footer{text-align:center;color:#929aaa;font-size:.67rem;margin:16px 0}.footer a{color:#174985;font-weight:800;text-decoration:none}.footer a:hover{text-decoration:underline}.loading{text-align:center;padding:50px 20px;color:#7d8798;font-size:.85rem}.error-page{text-align:center;padding:42px 22px}.error-page h1{font-size:1.3rem}.error-page p{color:#7d8798;font-size:.82rem}
    @media (max-width:520px){body{padding:15px 10px}.hero,.body{padding-left:19px;padding-right:19px}.row{grid-template-columns:1fr}.stats{gap:8px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark"><img src="./flavocon.png" alt="Zeedpay"></span> Zeedpay</div>
    <section id="app" class="card"><div class="loading">Loading money pool…</div></section>
    <div class="footer">Payments are processed securely by <a href="https://zeedpay.onrender.com/" target="_blank" rel="noopener noreferrer">Zeedpay</a>.</div>
  </main>
  <script>
    const API = (window.ZEEDPAY_API_URL || window.LIPILA_API_URL || "https://zeedpayserver.onrender.com").replace(/\/+$/,"");
    const queryReference = new URLSearchParams(location.search).get("reference") || "";
    const pathReference = location.pathname.split("/").filter(Boolean).pop() || "";
    const reference = decodeURIComponent(queryReference || (pathReference === "pool.html" ? "" : pathReference));
    const app = document.getElementById("app");
    let pool = null;
    let timer = null;

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[char]));
    const money = (value, currency) => `${currency} ${Number(value || 0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    const initials = value => String(value || "Z").split(/\s+/).filter(Boolean).slice(0,2).map(part => part[0]).join("").toUpperCase();
    const getJson = async (url, options) => {
      const response = await fetch(url, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.success === false) throw new Error(body.message || body.error?.message || "Something went wrong");
      return body;
    };
    const findUrl = value => {
      if (!value || typeof value !== "object") return "";
      for (const key of ["cardRedirectionUrl","cardRedirectUrl","redirectUrl","checkoutUrl","checkout_url"]) {
        if (typeof value[key] === "string" && value[key]) return value[key];
      }
      for (const child of Object.values(value)) {
        const found = findUrl(child);
        if (found) return found;
      }
      return "";
    };
    const statusText = value => String(value || "").toLowerCase();
    const isSuccess = value => /success|complete|paid|settled|approved|processed/.test(statusText(value));
    const isFinal = value => /success|complete|paid|settled|approved|processed|fail|cancel|reject|declin|expired|revers|refund/.test(statusText(value));

    function showNotice(message, kind) {
      const node = document.getElementById("notice");
      if (!node) return;
      node.className = `notice show ${kind}`;
      node.textContent = message;
    }

    function render() {
      const current = Number(pool.collectedAmount || 0);
      const target = Number(pool.targetAmount || 0);
      const percentage = target ? Math.min(100, Math.round(current / target * 100)) : 0;
      const mobile = pool.paymentMethod === "mobile_money";
      const closed = pool.status !== "ongoing";
      app.innerHTML = `
        <div class="hero">
          <div class="eyebrow">Money pool</div>
          <h1>${esc(pool.title)}</h1>
          <p>${esc(pool.description || "Support this Zeedpay money pool.")}</p>
          <div class="organizer"><span class="avatar">${esc(initials(pool.organizer?.name))}</span><span>Organized by <strong>${esc(pool.organizer?.name || "Zeedpay organizer")}</strong>${pool.organizer?.businessName ? ` · ${esc(pool.organizer.businessName)}` : ""}</span></div>
        </div>
        <div class="body">
          <div class="progress-label"><span>${esc(money(current,pool.currency))} raised</span><strong>${esc(percentage)}%</strong></div>
          <div class="progress"><span style="width:${percentage}%"></span></div>
          <div class="stats"><div class="stat"><small>Amount needed</small><strong>${esc(money(target,pool.currency))}</strong></div><div class="stat"><small>Still needed</small><strong>${esc(money(Math.max(0,target-current),pool.currency))}</strong></div></div>
          <div class="method">${mobile ? "Mobile Money" : "Card"} contributions</div>
          <div id="notice" class="notice"></div>
          ${closed ? `<div class="error-page"><h1>This pool is ${esc(pool.status)}</h1><p>It is no longer accepting new contributions.</p></div>` : `
            <h2 class="form-title">Make a contribution</h2>
            <form id="contributionForm" class="form">
              <div class="field"><label for="amount">Contribution amount (${esc(pool.currency)})</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" value="${esc(pool.suggestedAmount || "")}" required></div>
              <div class="field"><label for="donorName">Your name</label><input id="donorName" name="donorName" autocomplete="name" placeholder="Full name" required></div>
              <div class="row">
                <div class="field"><label for="phoneNumber">Phone number</label><input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel" placeholder="+260…" ${mobile ? "required" : ""}></div>
                <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" ${mobile ? "" : "required"}></div>
              </div>
              <p class="fine">${mobile ? "You will receive a Mobile Money payment prompt on the phone number above." : "You will continue to a secure card checkout after submitting this form."}</p>
              <button class="primary" type="submit">${mobile ? "Donate with Mobile Money" : "Donate now"}</button>
            </form>`}
        </div>`;
      document.getElementById("contributionForm")?.addEventListener("submit", startContribution);
    }

    async function startContribution(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button");
      button.disabled = true;
      showNotice("Starting your contribution…", "pending");
      const data = Object.fromEntries(new FormData(form).entries());
      const method = pool.paymentMethod === "mobile_money" ? "mobile-money" : "card";
      const checkoutWindow = method === "card" ? window.open("about:blank", "_blank") : null;
      try {
        const result = await getJson(`${API}/api/v1/public/money-pools/${encodeURIComponent(reference)}/contribute/${method}`, {
          method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data)
        });
        const payload = result.data || result;
        const contributionReference = payload.contributionReferenceId || payload.referenceId;
        if (!contributionReference) throw new Error("The contribution was created without a tracking reference.");
        if (method === "card") {
          const checkoutUrl = findUrl(payload);
          if (!checkoutUrl) throw new Error("The secure card checkout link was not returned.");
          if (checkoutWindow) checkoutWindow.location.href = checkoutUrl;
          else window.location.href = checkoutUrl;
          showNotice("Secure checkout opened in a new tab. Keep this page open while we confirm your contribution.", "pending");
        } else {
          showNotice("Payment prompt sent. Approve it on your phone; this page will update automatically.", "pending");
        }
        pollContribution(contributionReference);
      } catch (error) {
        if (checkoutWindow && !checkoutWindow.closed) checkoutWindow.close();
        showNotice(error.message || "Could not start the contribution.", "error");
        button.disabled = false;
      }
    }

    function pollContribution(contributionReference) {
      if (timer) clearInterval(timer);
      const check = async () => {
        try {
          const result = await getJson(`${API}/api/v1/public/money-pools/${encodeURIComponent(reference)}/contributions/${encodeURIComponent(contributionReference)}/status`);
          const payload = result.data || result;
          const status = payload.status || payload.transactionStatus;
          if (isSuccess(status)) {
            clearInterval(timer);
            await loadPool();
            showNotice("Contribution successful. Thank you for supporting this pool.", "success");
          } else if (isFinal(status)) {
            clearInterval(timer);
            showNotice("This contribution was not completed. You can try again.", "error");
            document.querySelector("#contributionForm button")?.removeAttribute("disabled");
          }
        } catch (error) {
          // A transient provider response should not interrupt polling.
        }
      };
      check();
      timer = setInterval(check, 5000);
    }

    async function loadPool() {
      try {
        const result = await getJson(`${API}/api/v1/public/money-pools/${encodeURIComponent(reference)}`);
        pool = result.pool || result.data?.pool;
        if (!pool) throw new Error("This money pool could not be loaded.");
        render();
      } catch (error) {
        app.innerHTML = `<div class="error-page"><h1>Money pool unavailable</h1><p>${esc(error.message || "This link may be invalid or expired.")}</p></div>`;
      }
    }
    loadPool();
  </script>
</body>
</html>
