<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="./flavocon.png">
  <link rel="apple-touch-icon" href="./flavocon.png">
  <title>Zeedpay Fundraiser</title>
  <style>
     :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:#f3f6fb}
     *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef5ff 0,#f7f8fb 34%,#f3f6fb 100%);padding:18px 14px}
     main{width:min(720px,100%);margin:0 auto}.brand{display:flex;align-items:center;gap:9px;color:#174985;font-weight:800;font-size:1.05rem;margin:4px 2px 16px}.brand-mark{display:grid;place-items:center;width:33px;height:33px;border-radius:11px;overflow:hidden;background:#0d5bd7;box-shadow:0 8px 18px #0d5bd733}.brand-mark img{display:block;width:100%;height:100%;object-fit:cover}
     .card{background:#fff;border:1px solid #e5eaf2;border-radius:27px;box-shadow:0 20px 50px #1a376318;overflow:hidden}.hero{padding:28px 28px 25px;background:linear-gradient(145deg,#0b55b9 0%,#143d81 100%);color:#fff}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.62rem;font-weight:800;color:#cfe0ff}.hero h1{font-size:clamp(1.65rem,5vw,2.55rem);line-height:1.08;margin:10px 0 8px;letter-spacing:-.04em}.hero p{color:#e0ebff;line-height:1.55;font-size:.9rem;margin:0;white-space:pre-wrap}.organizer{display:flex;align-items:center;gap:10px;margin-top:19px;color:#e7efff;font-size:.77rem}.avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#ffffff2b;font-weight:800}.body{padding:25px 28px 29px}.progress-label{display:flex;justify-content:space-between;gap:10px;font-size:.76rem;color:#697386;margin-bottom:8px}.progress-label strong{color:#182235}.progress{height:10px;border-radius:20px;background:#edf1f6;overflow:hidden}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#0d5bd7,#65aaff)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0 22px}.stat{padding:14px;border:1px solid #edf0f5;border-radius:16px;background:#fbfcfe}.stat small{display:block;color:#8992a2;font-size:.67rem}.stat strong{display:block;margin-top:5px;font-size:1.02rem}.method{display:inline-flex;align-items:center;padding:8px 11px;border-radius:11px;color:#174985;background:#eef4ff;font-size:.72rem;font-weight:750;margin-bottom:16px}.details{margin:0 0 21px;padding:15px 17px;border:1px solid #e9edf4;border-radius:16px;background:#fbfcff}.details h2{margin:0 0 7px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#627089}.details p{margin:0;color:#697386;font-size:.8rem;line-height:1.55;white-space:pre-wrap}.form-title{font-size:1.05rem;margin:0 0 14px;letter-spacing:-.02em}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 21px}.step{display:flex;align-items:center;gap:7px;color:#8a93a1;font-size:.68rem;font-weight:750}.step b{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#edf1f6;color:#7d8796;font-size:.7rem}.step.active{color:#174985}.step.active b{background:#0d5bd7;color:#fff}.step.done b{background:#dff4e7;color:#18743b}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:.7rem;font-weight:700;color:#626d7f}.field input{width:100%;height:46px;border:1px solid #dfe5ee;border-radius:13px;padding:0 12px;outline:0;color:#182235;background:#fff;font:inherit;font-size:.86rem}.field input:focus{border-color:#0d5bd7;box-shadow:0 0 0 3px #0d5bd71c}.primary{height:49px;border:0;border-radius:14px;background:#0d5bd7;color:#fff;font:inherit;font-size:.86rem;font-weight:800;cursor:pointer;margin-top:3px}.primary:disabled{opacity:.65;cursor:wait}.secondary{height:47px;border:1px solid #cad4e3;border-radius:14px;background:#fff;color:#174985;font:inherit;font-size:.82rem;font-weight:750;cursor:pointer}.review{display:grid;gap:0;padding:5px 15px;border:1px solid #e1e6ef;border-radius:16px;background:#f8fafc}.review-row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #e7ebf1;font-size:.76rem}.review-row:last-child{border-bottom:0}.review-row span{color:#77737d}.review-row strong{text-align:right;overflow-wrap:anywhere}.fine{font-size:.68rem;color:#8a93a1;line-height:1.45;margin:1px 0 0}.notice{display:none;padding:13px 14px;border-radius:13px;font-size:.78rem;line-height:1.45;margin-bottom:15px}.notice.show{display:block}.notice.pending{color:#725910;background:#fff7dc}.notice.success{color:#18743b;background:#e9f8ee}.notice.error{color:#a42c35;background:#fff0f0}.footer{text-align:center;color:#929aaa;font-size:.67rem;margin:16px 0}.footer a{color:#174985;font-weight:800;text-decoration:none}.footer a:hover{text-decoration:underline}.loading{text-align:center;padding:50px 20px;color:#7d8798;font-size:.85rem}.error-page{text-align:center;padding:42px 22px}.error-page h1{font-size:1.3rem}.error-page p{color:#7d8798;font-size:.82rem}.waiting{text-align:center;padding:18px 8px 6px}.waiting strong{display:block;margin:10px 0 5px;font-size:1rem}.waiting p{margin:0;color:#7d8798;font-size:.77rem;line-height:1.5}.spinner{width:44px;height:44px;margin:auto;border:4px solid #dfeafa;border-top-color:#0d5bd7;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
     @media (max-width:520px){body{padding:13px 9px}.hero,.body{padding-left:19px;padding-right:19px}.row{grid-template-columns:1fr}.stats{gap:8px}.steps{gap:4px}.step{font-size:.62rem}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark"><img src="./flavocon.png" alt="Zeedpay"></span> Zeedpay</div>
    <section id="app" class="card"><div class="loading">Loading fundraiser…</div></section>
    <div class="footer">Payments are processed securely by <a href="https://zeedpay.onrender.com/" target="_blank" rel="noopener noreferrer">Zeedpay</a>.</div>
  </main>
  <script>
    const API = (window.ZEEDPAY_API_URL || window.LIPILA_API_URL || "https://zeedpayserver.onrender.com").replace(/\/+$/,"");
    const queryReference = new URLSearchParams(location.search).get("reference") || "";
    const pathReference = location.pathname.split("/").filter(Boolean).pop() || "";
    const reference = decodeURIComponent(queryReference || (pathReference === "pool.html" ? "" : pathReference));
    const app = document.getElementById("app");
     let pool = null;
     let timer = null;
     let step = 1;
     let draft = {};
     let statusMessage = "";
     let statusKind = "";

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[char]));
    const money = (value, currency) => `${currency} ${Number(value || 0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    const initials = value => String(value || "Z").split(/\s+/).filter(Boolean).slice(0,2).map(part => part[0]).join("").toUpperCase();
    const getJson = async (url, options) => {
      const response = await fetch(url, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.success === false) throw new Error(body.message || body.error?.message || "Something went wrong");
      return body;
    };
    const findUrl = value => {
      if (!value || typeof value !== "object") return "";
      for (const key of ["cardRedirectionUrl","cardRedirectUrl","redirectUrl","checkoutUrl","checkout_url"]) {
        if (typeof value[key] === "string" && value[key]) return value[key];
      }
      for (const child of Object.values(value)) {
        const found = findUrl(child);
        if (found) return found;
      }
      return "";
    };
    const statusText = value => String(value || "").toLowerCase();
    const isSuccess = value => /success|complete|paid|settled|approved|processed/.test(statusText(value));
    const isFinal = value => /success|complete|paid|settled|approved|processed|fail|cancel|reject|declin|expired|revers|refund/.test(statusText(value));

    function showNotice(message, kind) {
      const node = document.getElementById("notice");
      if (!node) return;
      node.className = `notice show ${kind}`;
      node.textContent = message;
    }

    function stepMarkup() {
      return `<div class="steps"><div class="step ${step >= 1 ? "active" : ""} ${step > 1 ? "done" : ""}"><b>1</b><span>Details</span></div><div class="step ${step >= 2 ? "active" : ""} ${step > 2 ? "done" : ""}"><b>2</b><span>Review</span></div><div class="step ${step >= 3 ? "active" : ""}"><b>3</b><span>Complete</span></div></div>`;
    }

    function render() {
      const current = Number(pool.collectedAmount || 0);
      const target = Number(pool.targetAmount || 0);
      const percentage = target ? Math.min(100, Math.round(current / target * 100)) : 0;
      const mobile = pool.paymentMethod === "mobile_money";
      const closed = pool.status !== "ongoing";
       const message = statusMessage ? `<div id="notice" class="notice show ${statusKind}">${esc(statusMessage)}</div>` : `<div id="notice" class="notice"></div>`;
       const contributionForm = step === 1 ? `
             <h2 class="form-title">Start your contribution</h2>${stepMarkup()}
             <form id="contributionForm" class="form">
               <div class="field"><label for="amount">Contribution amount (${esc(pool.currency)})</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" value="${esc(draft.amount || pool.suggestedAmount || "")}" required></div>
               <div class="field"><label for="donorName">Your name</label><input id="donorName" name="donorName" autocomplete="name" value="${esc(draft.donorName || "")}" placeholder="Full name" required></div>
               <p class="fine">Your details are used only to identify this contribution and provide payment updates.</p>
               <button class="primary" type="submit">Continue</button>
             </form>` : step === 2 ? `
             <h2 class="form-title">Review your contribution</h2>${stepMarkup()}
             <div class="review"><div class="review-row"><span>Amount</span><strong>${esc(money(draft.amount,pool.currency))}</strong></div><div class="review-row"><span>Contributor</span><strong>${esc(draft.donorName)}</strong></div><div class="review-row"><span>Payment method</span><strong>${mobile ? "Mobile Money" : "Card"}</strong></div></div>
             <form id="contributionForm" class="form">
               <div class="row"><div class="field"><label for="phoneNumber">Phone number</label><input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel" value="${esc(draft.phoneNumber || "")}" placeholder="+260…" ${mobile ? "required" : ""}></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" value="${esc(draft.email || "")}" placeholder="you@example.com" ${mobile ? "" : "required"}></div></div>
               <p class="fine">${mobile ? "Approve the payment prompt sent to this number. The result will be checked automatically." : "You will continue to a secure card checkout after confirming."}</p>
               <button class="primary" type="submit">Contribute</button><button class="secondary" type="button" id="backToDetails">Back to details</button>
             </form>` : `
             ${stepMarkup()}<div class="waiting"><div class="spinner"></div><strong>Waiting for payment confirmation</strong><p>${esc(statusMessage || (mobile ? "Approve the Mobile Money prompt on your phone." : "Complete the secure card checkout in the new tab."))}</p></div>`;
       app.innerHTML = `
        <div class="hero">
          <div class="eyebrow">Fundraiser</div>
          <h1>${esc(pool.title)}</h1>
            <p>Contribute securely to this Zeedpay fundraiser.</p>
          <div class="organizer"><span class="avatar">${esc(initials(pool.organizer?.name))}</span><span>Organized by <strong>${esc(pool.organizer?.name || "Zeedpay organizer")}</strong>${pool.organizer?.businessName ? ` · ${esc(pool.organizer.businessName)}` : ""}</span></div>
        </div>
        <div class="body">
          <div class="progress-label"><span>${esc(money(current,pool.currency))} raised</span><strong>${esc(percentage)}%</strong></div>
          <div class="progress"><span style="width:${percentage}%"></span></div>
          <div class="stats"><div class="stat"><small>Goal</small><strong>${esc(money(target,pool.currency))}</strong></div><div class="stat"><small>Remaining</small><strong>${esc(money(Math.max(0,target-current),pool.currency))}</strong></div></div>
           <div class="method">${mobile ? "Mobile Money" : "Card"} contributions</div>
           <div class="details"><h2>Additional details</h2><p>${esc(pool.description || "The organizer has not added a description yet.")}</p></div>
           ${message}
          ${closed ? `<div class="error-page"><h1>This fundraiser is ${esc(pool.status)}</h1><p>It is no longer accepting new contributions.</p></div>` : `
             ${contributionForm}`}
        </div>`;
      document.getElementById("contributionForm")?.addEventListener("submit", startContribution);
       document.getElementById("backToDetails")?.addEventListener("click", () => { step = 1; statusMessage = ""; statusKind = ""; render(); });
    }

    async function startContribution(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const data = Object.fromEntries(new FormData(form).entries());
       if (step === 1) {
         draft = {...draft, ...data, amount: Number(data.amount)};
         step = 2;
         statusMessage = "";
         statusKind = "";
         render();
         return;
       }
       const button = form.querySelector("button[type=submit]");
       button.disabled = true;
       draft = {...draft, ...data};
       statusMessage = "Starting your contribution…";
       statusKind = "pending";
       step = 3;
       render();
      const method = pool.paymentMethod === "mobile_money" ? "mobile-money" : "card";
      const checkoutWindow = method === "card" ? window.open("about:blank", "_blank") : null;
      try {
         const result = await getJson(`${API}/api/v1/public/money-pools/${encodeURIComponent(reference)}/contribute/${method}`, {
           method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(draft)
        });
        const payload = result.data || result;
        const contributionReference = payload.contributionReferenceId || payload.referenceId;
        if (!contributionReference) throw new Error("The contribution was created without a tracking reference.");
        if (method === "card") {
          const checkoutUrl = findUrl(payload);
          if (!checkoutUrl) throw new Error("The secure card checkout link was not returned.");
          if (checkoutWindow) checkoutWindow.location.href = checkoutUrl;
          else window.location.href = checkoutUrl;
           statusMessage = "Secure checkout opened in a new tab. Keep this page open while we confirm your contribution.";
        } else {
           statusMessage = "Payment prompt sent. Approve it on your phone; this page will update automatically.";
        }
         statusKind = "pending";
         render();
        pollContribution(contributionReference);
      } catch (error) {
        if (checkoutWindow && !checkoutWindow.closed) checkoutWindow.close();
         step = 2;
         statusMessage = error.message || "Could not start the contribution.";
         statusKind = "error";
         render();
      }
    }

    function pollContribution(contributionReference) {
      if (timer) clearInterval(timer);
      const check = async () => {
        try {
          const result = await getJson(`${API}/api/v1/public/money-pools/${encodeURIComponent(reference)}/contributions/${encodeURIComponent(contributionReference)}/status`);
          const payload = result.data || result;
          const status = payload.status || payload.transactionStatus;
          if (isSuccess(status)) {
            clearInterval(timer);
            await loadPool();
             step = 3;
             statusMessage = "Contribution successful. Thank you for supporting this fundraiser.";
             statusKind = "success";
             render();
          } else if (isFinal(status)) {
            clearInterval(timer);
             step = 2;
             statusMessage = "This contribution was not completed. You can review the details and try again.";
             statusKind = "error";
             render();
          }
        } catch (error) {
          // A transient provider response should not interrupt polling.
        }
      };
      check();
      timer = setInterval(check, 5000);
    }

    async function loadPool() {
      try {
        const result = await getJson(`${API}/api/v1/public/money-pools/${encodeURIComponent(reference)}`);
        pool = result.pool || result.data?.pool;
        if (!pool) throw new Error("This fundraiser could not be loaded.");
        render();
      } catch (error) {
        app.innerHTML = `<div class="error-page"><h1>Fundraiser unavailable</h1><p>${esc(error.message || "This link may be invalid or expired.")}</p></div>`;
      }
    }
    loadPool();
  </script>
</body>
</html>
