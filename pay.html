<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="./flavocon.png">
  <link rel="apple-touch-icon" href="./flavocon.png">
  <title>Zeedpay Payment Link</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#4d3b6c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;background:radial-gradient(circle at 50% -10%,#f3edf7 0,#f5f7fb 42%)}main{width:min(560px,100%);margin:auto}.brand{display:flex;align-items:center;gap:9px;color:#4d3b6c;font-weight:800;margin:5px 2px 18px}.brand-mark{display:grid;place-items:center;width:33px;height:33px;border-radius:11px;overflow:hidden;background:#ff5f01}.brand-mark img{display:block;width:100%;height:100%;object-fit:cover}.card{background:#fff;border:1px solid #e3dfe5;border-radius:24px;overflow:hidden;box-shadow:0 18px 44px #4d3b6c14}.head{padding:26px;background:linear-gradient(135deg,#ff5f01,#4d3b6c);color:#fff}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.64rem;font-weight:800;color:#f3edf7}.head h1{font-size:1.8rem;line-height:1.15;margin:10px 0 7px}.head p{margin:0;color:#f3edf7;font-size:.85rem;line-height:1.5;white-space:pre-wrap}.body{padding:25px}.amount{font-size:1.75rem;font-weight:800;margin-bottom:3px}.muted{color:#f3edf7;font-size:.72rem}.organizer{margin:18px 0 22px;padding:12px 14px;border-radius:13px;background:#f4f7fc;color:#4d3b6c;font-size:.74rem}.organizer strong{color:#4d3b6c}.method{display:inline-block;padding:7px 10px;border-radius:9px;background:#f3edf7;color:#4d3b6c;font-size:.7rem;font-weight:800;margin-bottom:18px}.form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:.7rem;font-weight:700;color:#4d3b6c}.field input{height:45px;border:1px solid #f3edf7;border-radius:12px;padding:0 12px;font:inherit;font-size:.84rem;outline:0}.field input:focus{border-color:#ff5f01;box-shadow:0 0 0 3px #fd6d191c}.button{height:47px;border:0;border-radius:13px;background:#ff5f01;color:#fff;font:inherit;font-weight:800;cursor:pointer}.button:disabled{opacity:.65}.notice{display:none;padding:13px;border-radius:12px;font-size:.76rem;line-height:1.45;margin-bottom:15px}.notice.show{display:block}.pending{background:#fff7dc;color:#725910}.success{background:#e9f8ee;color:#18743b}.error{background:#fff0f0;color:#a42c35}.fine{color:#f3edf7;font-size:.68rem;line-height:1.45}.footer{text-align:center;color:#f3edf7;font-size:.67rem;margin-top:16px}.footer a{color:#4d3b6c;font-weight:800;text-decoration:none}.footer a:hover{text-decoration:underline}.unavailable{text-align:center;padding:45px 20px}.unavailable h1{font-size:1.25rem}.unavailable p{color:#f3edf7;font-size:.8rem}
     .checkout-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:23px}.checkout-head h1{margin:0;font-size:1.35rem;letter-spacing:-.03em}.secure-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;color:#17633c;background:#e7f7ed;font-size:.65rem;font-weight:800;white-space:nowrap}.secure-badge:before{content:"✓";display:grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;background:#2b9a5c}.merchant-block{padding:16px 17px;margin-bottom:22px;border:1px solid #e7ecf3;border-radius:16px;background:#faf9fb}.merchant-block .label,.amount-block .label,.method-label{display:block;margin-bottom:6px;color:#f3edf7;font-size:.68rem;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.merchant-block strong{font-size:.98rem}.amount-block{padding:17px 18px;margin-bottom:22px;border-radius:17px;background:#f6f1f5}.amount-block .amount{margin:0;font-size:2rem;letter-spacing:-.04em}.method-label{margin-bottom:10px}.method-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;margin-bottom:16px;border:1px solid #cdb4d5;border-radius:15px;color:#4d3b6c;background:#f3edf7}.method-choice strong{display:block;font-size:.82rem}.method-choice small{display:block;margin-top:4px;color:#4d3b6c;font-size:.68rem}.method-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;color:#4d3b6c;background:#f3edf7;font-size:1rem;font-weight:800}.pay-button{height:52px;font-size:.92rem;box-shadow:0 8px 16px #fd6d192b}.phone-hint{margin:-2px 0 2px}.checkout-title{display:none}@media(max-width:520px){.checkout-head{align-items:flex-start;flex-direction:column;gap:9px}.secure-badge{align-self:flex-start}}
   </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark"><img src="./flavocon.png" alt="Zeedpay"></span> Zeedpay</div>
    <section id="app" class="card"><div class="unavailable">Loading payment link…</div></section>
    <div class="footer">Payments are processed securely by <a href="https://zeedpay.onrender.com/" target="_blank" rel="noopener noreferrer">Zeedpay</a>.</div>
  </main>
  <script>
    const API=(window.ZEEDPAY_API_URL||window.LIPILA_API_URL||"https://zeedpayserver.onrender.com").replace(/\/+$/,"");
    const queryReference=new URLSearchParams(location.search).get("reference")||"";
    const pathReference=location.pathname.split("/").filter(Boolean).pop()||"";
    const reference=decodeURIComponent(queryReference||(pathReference==="pay.html"?"":pathReference));
    const app=document.getElementById("app");
    let link=null,timer=null;
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
     const money=(v,c)=>`${c==="ZMW"?"K":`${c} `}${Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    const json=async(url,options)=>{const r=await fetch(url,options);const b=await r.json().catch(()=>({}));if(!r.ok||b.success===false)throw Error(b.message||b.error?.message||"Something went wrong");return b};
    const success=s=>/success|complete|paid|settled|approved|processed/i.test(String(s||""));
    const final=s=>/success|complete|paid|settled|approved|processed|fail|cancel|reject|declin|expired|revers|refund/i.test(String(s||""));
    function notice(text,type){const e=document.getElementById("notice");if(e){e.className=`notice show ${type}`;e.textContent=text}}
    function render(){
      const mobile=link.paymentMethod==="mobile_money";
       const amountDue=money(link.amount,link.currency);
       app.innerHTML=`<div class="head"><div class="eyebrow">Payment Link</div><h1>Secure Checkout</h1><p>${esc(link.description||"Complete your payment securely with Zeedpay.")}</p></div><div class="body"><div class="checkout-head"><h1 class="checkout-title">Secure Checkout</h1><span class="secure-badge">Secure payment</span></div><div class="merchant-block"><span class="label">Merchant</span><strong>Payment to ${esc(link.businessName||link.organizer||"Zeedpay merchant")}</strong></div><div class="amount-block"><span class="label">Amount due</span><div class="amount">${esc(amountDue)}</div></div><div class="method-label">Payment method</div><div class="method-choice"><span><strong>${mobile?"Mobile Money":"Card"}</strong><small>${mobile?"Pay using your mobile money number":"Pay securely with your bank card"}</small></span><span class="method-icon">${mobile?"M":"C"}</span></div><div id="notice" class="notice"></div>${mobile?`<form id="payForm" class="form"><div class="field"><label for="donorName">Your name</label><input id="donorName" name="donorName" autocomplete="name" required placeholder="Full name"></div><div class="field"><label for="phoneNumber">Mobile money number</label><input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel" required placeholder="+260…"></div><p class="fine phone-hint">You'll receive a payment prompt on your phone.</p><button class="button pay-button" type="submit">Pay ${esc(amountDue)}</button></form>`:`<button class="button pay-button" id="cardButton" ${link.checkoutUrl?"":"disabled"}>${link.checkoutUrl?`Pay ${esc(amountDue)}`:"Checkout is preparing…"}</button><p class="fine">You'll continue to a secure card checkout.</p>`}</div>`;
      if(mobile)document.getElementById("payForm").addEventListener("submit",startMobile);else document.getElementById("cardButton")?.addEventListener("click",()=>{if(link.checkoutUrl)location.href=link.checkoutUrl});
    }
    async function startMobile(e){
      e.preventDefault();const form=e.currentTarget,button=form.querySelector("button");button.disabled=true;notice("Processing payment…","pending");
      try{const data=Object.fromEntries(new FormData(form).entries());const result=await json(`${API}/api/v1/public/payment-links/${encodeURIComponent(reference)}/contribute`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const payload=result.data||result;const id=payload.contributionReferenceId||payload.referenceId;if(!id)throw Error("The payment was created without a tracking reference.");notice("Awaiting secure payment confirmation…","pending");poll(id)}catch(error){notice(error.message||"Could not start this payment.","error");button.disabled=false}
    }
    function poll(id){if(timer)clearInterval(timer);const check=async()=>{try{const result=await json(`${API}/api/v1/public/payment-links/${encodeURIComponent(reference)}/contributions/${encodeURIComponent(id)}/status`);const payload=result.data||result;const status=payload.status||payload.transactionStatus;if(success(status)){clearInterval(timer);notice("Completed. Your payment has been completed successfully.","success")}else if(final(status)){clearInterval(timer);notice(/cancel|cancell/i.test(String(status))?"This payment was cancelled.":"We couldn't complete this payment. You can try again.","error");document.querySelector("#payForm button")?.removeAttribute("disabled")}}catch{}};check();timer=setInterval(check,5000)}
    async function load(){try{const result=await json(`${API}/api/v1/public/payment-links/${encodeURIComponent(reference)}`);link=result.link||result.data?.link;if(!link)throw Error("This payment link could not be loaded.");render()}catch(error){app.innerHTML=`<div class="unavailable"><h1>Payment link unavailable</h1><p>${esc(error.message||"This link may be invalid or inactive.")}</p></div>`}}
    load();
  </script>
</body>
</html>
